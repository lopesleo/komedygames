# Site do estúdio (komedygames.com): esta raiz + o site do Guardião, que é gerado no repositório
# lopesleo/lopesleo.github.io (pasta guardiao/ → public/guardiao/, branch dev) e só copiado para cá.
# Roda a cada push aqui, à mão (gh workflow run deploy.yml) e todo dia, para pegar as mudanças de lá.
name: Publicar komedygames.com
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site do Guardião (lopesleo.github.io, branch dev)
        uses: actions/checkout@v4
        with:
          repository: lopesleo/lopesleo.github.io
          ref: dev
          path: _src
          sparse-checkout: public/guardiao
      - name: Montar
        run: |
          mkdir -p _site
          cp -r index.html 404.html CNAME robots.txt sitemap.xml app-ads.txt .nojekyll assets _site/
          cp -r _src/public/guardiao _site/guardiao
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
